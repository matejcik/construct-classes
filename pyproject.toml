[project]
name = "construct-classes"
version = "0.2.3"
description = "Parse your binary structs into dataclasses"
authors = [{ name = "matejcik", email = "ja@matejcik.cz" }]
requires-python = ">=3.10,<4.0"
readme = "README.rst"
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "construct~=2.10",
]

[project.urls]
Homepage = "https://github.com/matejcik/construct-classes"
Repository = "https://github.com/matejcik/construct-classes"

[dependency-groups]
dev = [
    "pytest>5",
    "black>=22.8.0,<23",
    "isort>=5.10.1,<6",
    "flake8>=5.0.4,<6",
    "construct-typing>=0.5.2,<0.6",
    "typing-extensions>4.2",
]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = [
    "CHANGELOG.rst",
    "LICENSE",
    "README.rst",
    "tests/",
]

[tool.isort]
profile = "black"
